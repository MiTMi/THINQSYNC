<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark rounded background -->
  <rect width="1024" height="1024" rx="220" fill="#1C1C1E"/>

  <!-- BLUE NOTE (back, slightly left and up) -->
  <g transform="rotate(-8, 380, 420)">
    <rect x="180" y="220" width="400" height="360" rx="30" fill="#38BDF8"/>
    <rect x="230" y="290" width="240" height="12" rx="6" fill="#0284C7"/>
    <rect x="230" y="330" width="300" height="12" rx="6" fill="#0284C7"/>
    <rect x="230" y="370" width="180" height="12" rx="6" fill="#0284C7"/>
    <rect x="230" y="410" width="260" height="12" rx="6" fill="#0284C7"/>
  </g>

  <!-- PINK NOTE (middle, slightly right) -->
  <g transform="rotate(5, 600, 480)">
    <rect x="400" y="280" width="400" height="360" rx="30" fill="#FBCFE8"/>
    <rect x="450" y="350" width="220" height="12" rx="6" fill="#DB2777"/>
    <rect x="450" y="390" width="300" height="12" rx="6" fill="#DB2777"/>
    <rect x="450" y="430" width="180" height="12" rx="6" fill="#DB2777"/>
    <rect x="450" y="470" width="260" height="12" rx="6" fill="#DB2777"/>
  </g>

  <!-- YELLOW NOTE (front, center) -->
  <g transform="rotate(-3, 512, 580)">
    <rect x="260" y="400" width="500" height="420" rx="35" fill="#FDE047"/>
    <rect x="320" y="490" width="300" height="14" rx="7" fill="#A16207"/>
    <rect x="320" y="540" width="380" height="14" rx="7" fill="#A16207"/>
    <rect x="320" y="590" width="240" height="14" rx="7" fill="#A16207"/>
    <rect x="320" y="640" width="320" height="14" rx="7" fill="#A16207"/>
    <!-- Wavy line signature -->
    <path d="M 330 720 Q 400 680, 470 720 Q 540 760, 610 720" stroke="#A16207" stroke-width="14" fill="none" stroke-linecap="round"/>
  </g>
</svg>
