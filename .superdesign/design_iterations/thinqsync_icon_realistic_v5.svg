<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base background with black rounded square -->
    <linearGradient id="baseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>

    <!-- Colorful gradient wallpaper background - WITH ORANGE, NO PINK, NO PURPLE -->
    <linearGradient id="wallpaperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="33%" stop-color="#F59E0B"/>
      <stop offset="66%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Blue note gradient - stronger, more vibrant -->
    <linearGradient id="blueNote" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5DADE2"/>
      <stop offset="100%" stop-color="#3498DB"/>
    </linearGradient>

    <!-- Yellow note gradient - stronger, more saturated -->
    <linearGradient id="yellowNote" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#FFC107"/>
    </linearGradient>

    <!-- Lime/Green note gradient - stronger, more vibrant -->
    <linearGradient id="greenNote" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AED136"/>
      <stop offset="100%" stop-color="#9BC93A"/>
    </linearGradient>

    <!-- Heavy shadow for the base -->
    <filter id="heavyShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="30"/>
      <feOffset dx="0" dy="40" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Note shadow - realistic depth -->
    <filter id="noteDepth" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="0" dy="20" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Top note shadow - lighter -->
    <filter id="topNoteDepth" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="12" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shine effect -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Page curl shadow -->
    <filter id="curlShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Fold gradient for blue note -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D9E"/>
      <stop offset="100%" stop-color="#1F5F7A"/>
    </linearGradient>

    <!-- Darker blue for fold back -->
    <linearGradient id="foldBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2874A6"/>
      <stop offset="100%" stop-color="#1A5276"/>
    </linearGradient>
  </defs>

  <!-- Main icon base with rounded corners -->
  <rect width="1024" height="1024" rx="226" fill="url(#baseBg)" filter="url(#heavyShadow)"/>

  <!-- Border rim -->
  <rect x="10" y="10" width="1004" height="1004" rx="220" fill="none" stroke="#5A5A5C" stroke-width="2" opacity="0.5"/>

  <!-- Colorful wallpaper inside - Cyan, Purple, Orange, Green -->
  <rect x="60" y="60" width="904" height="904" rx="180" fill="url(#wallpaperGrad)"/>

  <!-- Blur overlay on wallpaper for depth -->
  <rect x="60" y="60" width="904" height="904" rx="180" fill="#000000" opacity="0.15"/>

  <!-- BLUE NOTE (back left) - WITH FOLDED CORNER -->
  <g filter="url(#noteDepth)">
    <!-- Main note body -->
    <rect x="40" y="340" width="420" height="400" rx="44" fill="url(#blueNote)"/>

    <!-- Top shine -->
    <rect x="40" y="340" width="420" height="120" rx="44" fill="url(#shine)"/>

    <!-- Close button -->
    <circle cx="85" cy="385" r="16" fill="#2874A6" opacity="0.6"/>
    <path d="M 79 379 L 91 391 M 91 379 L 79 391" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

    <!-- Note lines with varying lengths -->
    <line x1="85" y1="470" x2="400" y2="470" stroke="#2874A6" stroke-width="12" stroke-linecap="round" opacity="0.45"/>
    <line x1="85" y1="535" x2="280" y2="535" stroke="#2874A6" stroke-width="12" stroke-linecap="round" opacity="0.45"/>
    <line x1="85" y1="600" x2="380" y2="600" stroke="#2874A6" stroke-width="12" stroke-linecap="round" opacity="0.45"/>

    <!-- Bullet points -->
    <circle cx="100" cy="665" r="7" fill="#2874A6" opacity="0.45"/>
    <line x1="125" y1="665" x2="310" y2="665" stroke="#2874A6" stroke-width="12" stroke-linecap="round" opacity="0.45"/>

  </g>

  <!-- YELLOW NOTE (top right) - SMALLER SIZE -->
  <g filter="url(#topNoteDepth)">
    <rect x="580" y="40" width="380" height="340" rx="44" fill="url(#yellowNote)"/>

    <!-- Top shine -->
    <rect x="580" y="40" width="380" height="105" rx="44" fill="url(#shine)"/>

    <!-- Close button -->
    <circle cx="625" cy="85" r="16" fill="#E67E22" opacity="0.5"/>
    <path d="M 619 79 L 631 91 M 631 79 L 619 91" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

    <!-- Bullet list style -->
    <circle cx="630" cy="160" r="8" fill="#D68910" opacity="0.5"/>
    <line x1="655" y1="160" x2="900" y2="160" stroke="#D68910" stroke-width="11" stroke-linecap="round" opacity="0.5"/>

    <circle cx="630" cy="215" r="8" fill="#D68910" opacity="0.5"/>
    <line x1="655" y1="215" x2="780" y2="215" stroke="#D68910" stroke-width="11" stroke-linecap="round" opacity="0.5"/>

    <circle cx="630" cy="270" r="8" fill="#D68910" opacity="0.5"/>
    <line x1="655" y1="270" x2="860" y2="270" stroke="#D68910" stroke-width="11" stroke-linecap="round" opacity="0.5"/>

    <circle cx="630" cy="325" r="8" fill="#D68910" opacity="0.5"/>
    <line x1="655" y1="325" x2="810" y2="325" stroke="#D68910" stroke-width="11" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- LIME/GREEN NOTE (bottom right) - LARGER SIZE WITH BOTTOM FOLD -->
  <g filter="url(#topNoteDepth)">
    <rect x="540" y="540" width="440" height="420" rx="44" fill="url(#greenNote)"/>

    <!-- Top shine -->
    <rect x="540" y="540" width="440" height="120" rx="44" fill="url(#shine)"/>

    <!-- Close button -->
    <circle cx="585" cy="585" r="16" fill="#7D8E2A" opacity="0.5"/>
    <path d="M 579 579 L 591 591 M 591 579 L 579 591" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

    <!-- Lines on note -->
    <line x1="590" y1="670" x2="920" y2="670" stroke="#7D8E2A" stroke-width="13" stroke-linecap="round" opacity="0.5"/>
    <line x1="590" y1="735" x2="840" y2="735" stroke="#7D8E2A" stroke-width="13" stroke-linecap="round" opacity="0.5"/>
    <line x1="590" y1="800" x2="930" y2="800" stroke="#7D8E2A" stroke-width="13" stroke-linecap="round" opacity="0.5"/>
    <line x1="590" y1="865" x2="860" y2="865" stroke="#7D8E2A" stroke-width="13" stroke-linecap="round" opacity="0.5"/>

    <!-- BOTTOM RIGHT CORNER CURL -->
    <g filter="url(#curlShadow)">
      <path d="M 940 920 Q 960 930, 980 960 Q 970 940, 960 930 Q 950 925, 940 920 Z"
            fill="#8FA034" opacity="0.95"/>
      <path d="M 960 930 L 980 960 L 965 950 Z" fill="#6B7A26" opacity="0.7"/>
      <!-- Curl highlight -->
      <path d="M 940 920 Q 950 922, 960 930" stroke="#C5D65C" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Overall subtle highlight at top of icon for glass effect -->
  <ellipse cx="512" cy="200" rx="400" ry="150" fill="#FFFFFF" opacity="0.08"/>

  <!-- Outer border for polish -->
  <rect x="2" y="2" width="1020" height="1020" rx="226" fill="none" stroke="#000000" stroke-width="3" opacity="0.3"/>
</svg>