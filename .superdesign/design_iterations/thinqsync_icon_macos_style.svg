<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for background (macOS wallpaper inspired) -->
    <radialGradient id="bgGrad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#667EEA"/>
      <stop offset="25%" stop-color="#764BA2"/>
      <stop offset="50%" stop-color="#F093FB"/>
      <stop offset="75%" stop-color="#F5576C"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </radialGradient>

    <!-- Deep shadow for base -->
    <filter id="baseShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="0" dy="30" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow for sticky notes -->
    <filter id="noteShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="16" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Light shadow for top notes -->
    <filter id="lightShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glossy effect -->
    <linearGradient id="glossy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Blue note gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7EC8E3"/>
      <stop offset="100%" stop-color="#5DADE2"/>
    </linearGradient>

    <!-- Yellow note gradient -->
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7DC6F"/>
      <stop offset="100%" stop-color="#F4D03F"/>
    </linearGradient>

    <!-- Lime note gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4E157"/>
      <stop offset="100%" stop-color="#C0CA33"/>
    </linearGradient>

    <!-- Page curl gradient -->
    <linearGradient id="curlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90A4"/>
      <stop offset="100%" stop-color="#5DADE2"/>
    </linearGradient>
  </defs>

  <!-- Main rounded square background (macOS icon shape) -->
  <rect width="1024" height="1024" rx="226" fill="url(#bgGrad)" filter="url(#baseShadow)"/>

  <!-- Darker inner border for depth -->
  <rect width="1024" height="1024" rx="226" fill="none" stroke="#000000" stroke-width="2" opacity="0.15"/>

  <!-- Blue sticky note (back left) -->
  <g filter="url(#noteShadow)">
    <rect x="80" y="280" width="380" height="380" rx="40" fill="url(#blueGrad)"/>
    <rect x="80" y="280" width="380" height="380" rx="40" fill="url(#glossy)"/>

    <!-- Close button -->
    <circle cx="130" cy="330" r="18" fill="#4A90A4" opacity="0.6"/>
    <path d="M 123 323 L 137 337 M 137 323 L 123 337" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Note lines -->
    <line x1="130" y1="410" x2="400" y2="410" stroke="#4A90A4" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
    <line x1="130" y1="460" x2="300" y2="460" stroke="#4A90A4" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
    <line x1="130" y1="510" x2="380" y2="510" stroke="#4A90A4" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
    <line x1="130" y1="560" x2="320" y2="560" stroke="#4A90A4" stroke-width="10" stroke-linecap="round" opacity="0.5"/>

    <!-- Bullet points -->
    <circle cx="145" y="560" r="8" fill="#4A90A4" opacity="0.5"/>
    <circle cx="230" y="600" r="8" fill="#4A90A4" opacity="0.5"/>

    <!-- Page curl effect (bottom right) -->
    <path d="M 420 620 Q 440 640, 460 660 L 460 640 Q 440 620, 420 620 Z" fill="url(#curlGrad)" opacity="0.8"/>
    <path d="M 460 640 L 460 660 L 440 660 Z" fill="#2E6C7A" opacity="0.4"/>
  </g>

  <!-- Yellow sticky note (top right) -->
  <g filter="url(#lightShadow)">
    <rect x="480" y="100" width="440" height="380" rx="40" fill="url(#yellowGrad)"/>
    <rect x="480" y="100" width="440" height="380" rx="40" fill="url(#glossy)"/>

    <!-- Close button -->
    <circle cx="535" cy="155" r="18" fill="#D4AC0D" opacity="0.5"/>
    <path d="M 528 148 L 542 162 M 542 148 L 528 162" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Bullet list with lines -->
    <circle cx="540" cy="230" r="10" fill="#B7950B" opacity="0.6"/>
    <line x1="570" y1="230" x2="860" y2="230" stroke="#B7950B" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

    <circle cx="540" cy="290" r="10" fill="#B7950B" opacity="0.6"/>
    <line x1="570" y1="290" x2="780" y2="290" stroke="#B7950B" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

    <circle cx="540" cy="350" r="10" fill="#B7950B" opacity="0.6"/>
    <line x1="570" y1="350" x2="840" y2="350" stroke="#B7950B" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

    <circle cx="540" cy="410" r="10" fill="#B7950B" opacity="0.6"/>
    <line x1="570" y1="410" x2="790" y2="410" stroke="#B7950B" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Lime green sticky note (bottom right) -->
  <g filter="url(#lightShadow)">
    <rect x="480" y="520" width="440" height="400" rx="40" fill="url(#limeGrad)"/>
    <rect x="480" y="520" width="440" height="400" rx="40" fill="url(#glossy)"/>

    <!-- Close button -->
    <circle cx="535" cy="575" r="18" fill="#9E9D24" opacity="0.5"/>
    <path d="M 528 568 L 542 582 M 542 568 L 528 582" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Note lines -->
    <line x1="540" y1="660" x2="860" y2="660" stroke="#9E9D24" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
    <line x1="540" y1="730" x2="800" y2="730" stroke="#9E9D24" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
    <line x1="540" y1="800" x2="860" y2="800" stroke="#9E9D24" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
    <line x1="540" y1="870" x2="820" y2="870" stroke="#9E9D24" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Subtle highlight on entire icon -->
  <rect x="20" y="20" width="984" height="500" rx="200" fill="url(#glossy)" opacity="0.3"/>

  <!-- Final border -->
  <rect width="1024" height="1024" rx="226" fill="none" stroke="url(#glossy)" stroke-width="3"/>
</svg>