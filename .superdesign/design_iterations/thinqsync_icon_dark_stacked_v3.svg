<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark rounded background -->
  <rect width="1024" height="1024" rx="220" fill="#1C1C1E"/>

  <!-- BLUE NOTE (back, top-left area) -->
  <g transform="rotate(-12, 400, 380)">
    <rect x="200" y="200" width="340" height="300" rx="25" fill="#38BDF8"/>
    <rect x="240" y="260" width="200" height="10" rx="5" fill="#0284C7"/>
    <rect x="240" y="295" width="260" height="10" rx="5" fill="#0284C7"/>
    <rect x="240" y="330" width="160" height="10" rx="5" fill="#0284C7"/>
    <rect x="240" y="365" width="220" height="10" rx="5" fill="#0284C7"/>
  </g>

  <!-- PINK NOTE (middle, top-right area) -->
  <g transform="rotate(8, 650, 400)">
    <rect x="480" y="220" width="340" height="300" rx="25" fill="#FBCFE8"/>
    <rect x="520" y="280" width="180" height="10" rx="5" fill="#DB2777"/>
    <rect x="520" y="315" width="260" height="10" rx="5" fill="#DB2777"/>
    <rect x="520" y="350" width="140" height="10" rx="5" fill="#DB2777"/>
    <rect x="520" y="385" width="200" height="10" rx="5" fill="#DB2777"/>
  </g>

  <!-- YELLOW NOTE (front, center-bottom) -->
  <g transform="rotate(-4, 512, 620)">
    <rect x="280" y="420" width="460" height="380" rx="30" fill="#FDE047"/>
    <rect x="330" y="500" width="280" height="12" rx="6" fill="#A16207"/>
    <rect x="330" y="545" width="360" height="12" rx="6" fill="#A16207"/>
    <rect x="330" y="590" width="220" height="12" rx="6" fill="#A16207"/>
    <rect x="330" y="635" width="300" height="12" rx="6" fill="#A16207"/>
    <!-- Wavy signature -->
    <path d="M 340 710 Q 410 670, 480 710 Q 550 750, 620 710" stroke="#A16207" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>
</svg>
