<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <rect width="1024" height="1024" rx="226" fill="url(#grad1)"/>

  <!-- Sticky note stack - back note (purple) -->
  <rect x="380" y="340" width="380" height="380" rx="24" fill="#9D7FE8" opacity="0.4"/>

  <!-- Middle note (blue) -->
  <rect x="340" y="300" width="380" height="380" rx="24" fill="#6B9FE8" opacity="0.6"/>

  <!-- Front note (yellow) -->
  <rect x="300" y="260" width="380" height="380" rx="24" fill="#FFE066"/>

  <!-- Shadow on front note -->
  <rect x="300" y="260" width="380" height="380" rx="24" fill="url(#shadow1)" opacity="0.15"/>

  <!-- Note lines on front note -->
  <line x1="340" y1="360" x2="640" y2="360" stroke="#8B7355" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
  <line x1="340" y1="420" x2="580" y2="420" stroke="#8B7355" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
  <line x1="340" y1="480" x2="620" y2="480" stroke="#8B7355" stroke-width="8" stroke-linecap="round" opacity="0.3"/>

  <!-- Folded corner effect -->
  <path d="M 640 260 L 640 320 L 680 280 Z" fill="#FFD633" opacity="0.8"/>

  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#E9ECEF"/>
    </linearGradient>
    <linearGradient id="shadow1" x1="300" y1="260" x2="300" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
</svg>