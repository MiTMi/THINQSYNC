<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <rect width="1024" height="1024" rx="226" fill="url(#grad3)"/>

  <!-- Main note card -->
  <rect x="220" y="220" width="584" height="700" rx="32" fill="#FFFFFF" stroke="#2D3748" stroke-width="6"/>

  <!-- Note shadow -->
  <rect x="220" y="220" width="584" height="700" rx="32" fill="url(#noteShadow)" opacity="0.1"/>

  <!-- Header bar -->
  <rect x="220" y="220" width="584" height="100" rx="32" fill="url(#headerGrad)"/>
  <rect x="220" y="287" width="584" height="33" fill="url(#headerGrad)"/>

  <!-- Note lines -->
  <line x1="280" y1="400" x2="744" y2="400" stroke="#CBD5E0" stroke-width="10" stroke-linecap="round"/>
  <line x1="280" y1="480" x2="744" y2="480" stroke="#CBD5E0" stroke-width="10" stroke-linecap="round"/>
  <line x1="280" y1="560" x2="680" y2="560" stroke="#CBD5E0" stroke-width="10" stroke-linecap="round"/>
  <line x1="280" y1="640" x2="720" y2="640" stroke="#CBD5E0" stroke-width="10" stroke-linecap="round"/>
  <line x1="280" y1="720" x2="660" y2="720" stroke="#CBD5E0" stroke-width="10" stroke-linecap="round"/>
  <line x1="280" y1="800" x2="700" y2="800" stroke="#CBD5E0" stroke-width="10" stroke-linecap="round"/>

  <!-- Sync symbol badge -->
  <circle cx="700" cy="320" r="100" fill="url(#syncGrad)" stroke="#FFFFFF" stroke-width="8"/>

  <!-- Sync arrows -->
  <path d="M 700 260
           C 740 260, 760 280, 760 320
           L 760 340
           L 780 320
           L 760 300
           L 760 320
           C 760 300, 740 280, 700 280
           L 700 260 Z"
           fill="#FFFFFF"/>

  <path d="M 700 380
           C 660 380, 640 360, 640 320
           L 640 300
           L 620 320
           L 640 340
           L 640 320
           C 640 340, 660 360, 700 360
           L 700 380 Z"
           fill="#FFFFFF"/>

  <defs>
    <linearGradient id="grad3" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EBF8FF"/>
      <stop offset="100%" stop-color="#BEE3F8"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="220" y1="220" x2="804" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4299E1"/>
      <stop offset="100%" stop-color="#3182CE"/>
    </linearGradient>
    <linearGradient id="syncGrad" x1="600" y1="220" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#48BB78"/>
      <stop offset="100%" stop-color="#38A169"/>
    </linearGradient>
    <linearGradient id="noteShadow" x1="220" y1="220" x2="220" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
</svg>