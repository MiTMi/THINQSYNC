<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <rect width="1024" height="1024" rx="226" fill="url(#grad2)"/>

  <!-- Brain outline with note fusion -->
  <path d="M 512 240
           C 600 240, 680 280, 720 350
           C 740 380, 750 415, 750 450
           C 750 520, 720 580, 680 620
           C 650 650, 600 670, 550 680
           L 550 750
           L 474 750
           L 474 680
           C 424 670, 374 650, 344 620
           C 304 580, 274 520, 274 450
           C 274 415, 284 380, 304 350
           C 344 280, 424 240, 512 240 Z"
           fill="url(#brainGrad)" stroke="#4A5568" stroke-width="8"/>

  <!-- Brain lobes detail -->
  <ellipse cx="420" cy="380" rx="60" ry="70" fill="#805AD5" opacity="0.3"/>
  <ellipse cx="604" cy="380" rx="60" ry="70" fill="#805AD5" opacity="0.3"/>

  <!-- Note lines inside brain -->
  <line x1="380" y1="460" x2="644" y2="460" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <line x1="380" y1="520" x2="644" y2="520" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <line x1="380" y1="580" x2="580" y2="580" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.8"/>

  <!-- Paper fold at bottom -->
  <path d="M 474 750 L 474 680 L 550 680 L 550 750 L 512 720 Z" fill="#6B46C1"/>

  <!-- Thinking dots -->
  <circle cx="380" cy="340" r="16" fill="#2D3748" opacity="0.6"/>
  <circle cx="644" cy="340" r="16" fill="#2D3748" opacity="0.6"/>

  <defs>
    <linearGradient id="grad2" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#E9D8FD"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="274" y1="240" x2="750" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9F7AEA"/>
      <stop offset="100%" stop-color="#6B46C1"/>
    </linearGradient>
  </defs>
</svg>